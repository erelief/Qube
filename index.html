<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q°ube</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <div id="toolbar">
      <div class="tool-group">
        <button id="btn-open" title="Open Panorama (O)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
      </div>

      <div class="tool-group">
        <label for="fov-slider" class="tool-label">FOV</label>
        <input type="range" id="fov-slider" min="30" max="120" value="90" />
        <span id="fov-value" class="tool-value">90°</span>
      </div>

      <div class="tool-group">
        <button id="btn-mask-toggle" title="Toggle Crop Mask (M)" class="active">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scan">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
          </svg>
        </button>
      </div>

      <div class="tool-separator"></div>

      <div class="tool-group">
        <button id="btn-capture" title="Capture (S)" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>
        <button id="btn-cubemap" title="Cubemap (C)" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-box">
            <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
            <path d="m3.3 7 8.7 5 8.7-5"/>
            <path d="M12 22V12"/>
          </svg>
        </button>
      </div>

      <div class="tool-spacer"></div>

      <div class="tool-info">
        <span id="image-info">No image loaded</span>
      </div>

      <button id="btn-about" title="About">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4"/>
          <path d="M12 8h.01"/>
        </svg>
      </button>
    </div>

    <!-- 3D Viewer Container -->
    <div id="viewer">
      <div id="canvas-wrapper"></div>
      <div id="aspect-mask">
        <div class="mask-area mask-top"></div>
        <div class="mask-middle">
          <div class="mask-area mask-left"></div>
          <div class="mask-clear"></div>
          <div class="mask-area mask-right"></div>
        </div>
        <div class="mask-area mask-bottom"></div>
      </div>
      <!-- Focal-length style aspect ratio slider (inside viewer bottom) -->
    <div id="focal-slider" class="focal-slider">
      <div class="focal-options">
        <button class="focal-option active" data-ratio="1:1" data-index="0">
          <span class="focal-label">1:1</span>
          <span class="focal-preview focal-preview-square"></span>
        </button>
        <button class="focal-option" data-ratio="4:3" data-index="1">
          <span class="focal-label">4:3</span>
          <span class="focal-preview focal-preview-43"></span>
        </button>
        <button class="focal-option" data-ratio="3:2" data-index="2">
          <span class="focal-label">3:2</span>
          <span class="focal-preview focal-preview-32"></span>
        </button>
      </div>
    </div>
    </div>

    <!-- Empty state overlay -->
    <div id="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <p>Drop a panorama image here or click Open</p>
      <p class="hint">Supports JPG, PNG, WebP, BMP</p>
    </div>

    <!-- Export / Preview Dialog -->
    <div id="export-dialog" class="dialog hidden">
      <div class="dialog-backdrop"></div>
      <div class="dialog-content" tabindex="-1">
        <button class="dialog-close" title="Close (Esc)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <h2 id="dialog-title">Captured Shots</h2>

        <div id="preview-grid"></div>

        <div class="export-options">
          <div class="option-row" id="label-row" style="display:none;">
            <label>Labels:</label>
            <button id="btn-label-toggle" class="label-toggle-btn active" type="button">
              <span class="label-toggle-track"></span>
            </button>
            <span id="label-status" class="label-status">On</span>
          </div>
          <div class="option-row">
            <label for="export-format">Format:</label>
            <select id="export-format">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
            </select>
          </div>
          <div class="option-row" id="quality-row">
            <label for="export-quality">Quality:</label>
            <input type="range" id="export-quality" min="1" max="100" value="95" />
            <span id="quality-value">95%</span>
          </div>
        </div>

        <div class="dialog-actions">
          <button id="btn-save-merged" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Save Merged
          </button>
        </div>
      </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="dialog hidden">
      <div class="dialog-backdrop"></div>
      <div class="lightbox-content">
        <button class="dialog-close" title="Close (Esc)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <img id="lightbox-img" alt="Preview" />
      </div>
    </div>

    <!-- About Dialog -->
    <div id="about-dialog" class="dialog hidden">
      <div class="dialog-backdrop"></div>
      <div class="dialog-content about-content" tabindex="-1">
        <button class="dialog-close" title="Close (Esc)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <div class="about-title-row">
          <img class="about-app-icon" id="about-app-icon" src="" alt="">
          <span class="about-app-name">Q°ube</span>
          <span class="about-version">v<span id="about-version-number"></span></span>
        </div>
        <div class="about-divider"></div>
        <div class="about-section">
          <span class="about-label">Repository</span>
          <a class="about-value about-value-link" href="https://github.com/erelief/Qube" target="_blank" rel="noopener noreferrer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            <span>erelief/Qube</span>
          </a>
        </div>
        <div class="about-section">
          <span class="about-label">License</span>
          <span class="about-value">MIT License</span>
        </div>
        <div class="about-divider"></div>
        <div class="about-deps-title">Acknowledgments</div>
        <div class="about-dep-item"><span class="about-dep-name">Tauri</span><a class="about-dep-link" href="https://tauri.app" target="_blank" rel="noopener noreferrer">v2</a></div>
        <div class="about-dep-item"><span class="about-dep-name">Three.js</span><a class="about-dep-link" href="https://threejs.org" target="_blank" rel="noopener noreferrer">v0.174</a></div>
        <div class="about-dep-item"><span class="about-dep-name">Lucide</span><a class="about-dep-link" href="https://lucide.dev" target="_blank" rel="noopener noreferrer">lucide.dev</a></div>
      </div>
    </div>

    <!-- Drop zone overlay -->
    <div id="drop-zone" class="hidden">
      <div class="drop-zone-content">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drop panorama image here</p>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
