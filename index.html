<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>360 Panorama Viewer</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <div id="toolbar">
      <div class="tool-group">
        <button id="btn-open" title="Open Panorama (O)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </button>
      </div>

      <div class="tool-group">
        <label for="fov-slider" class="tool-label">FOV</label>
        <input type="range" id="fov-slider" min="30" max="120" value="90" />
        <span id="fov-value" class="tool-value">90°</span>
      </div>

      <div class="tool-separator"></div>

      <div class="tool-group">
        <button id="btn-capture" title="Capture 4 Directions (C)" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>
        <button id="btn-export" title="View Last Capture (E)" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
      </div>

      <div class="tool-spacer"></div>

      <div class="tool-info">
        <span id="image-info">No image loaded</span>
      </div>
    </div>

    <!-- 3D Viewer Container -->
    <div id="viewer"></div>

    <!-- Empty state overlay -->
    <div id="empty-state">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <path d="M2 12h20"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <p>Drop a panorama image here or click Open</p>
      <p class="hint">Supports JPG, PNG, WebP, BMP</p>
    </div>

    <!-- Export / Preview Dialog -->
    <div id="export-dialog" class="dialog hidden">
      <div class="dialog-backdrop"></div>
      <div class="dialog-content" tabindex="-1">
        <button class="dialog-close" title="Close (Esc)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <h2>Captured Shots</h2>

        <div id="preview-grid">
          <div class="preview-item" data-dir="front">
            <div class="preview-thumb">
              <img id="preview-front" alt="Front" />
              <button class="preview-download" title="Save Front">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </button>
            </div>
            <span>Front</span>
          </div>
          <div class="preview-item" data-dir="right">
            <div class="preview-thumb">
              <img id="preview-right" alt="Right" />
              <button class="preview-download" title="Save Right">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </button>
            </div>
            <span>Right</span>
          </div>
          <div class="preview-item" data-dir="back">
            <div class="preview-thumb">
              <img id="preview-back" alt="Back" />
              <button class="preview-download" title="Save Back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </button>
            </div>
            <span>Back</span>
          </div>
          <div class="preview-item" data-dir="left">
            <div class="preview-thumb">
              <img id="preview-left" alt="Left" />
              <button class="preview-download" title="Save Left">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
              </button>
            </div>
            <span>Left</span>
          </div>
        </div>

        <div class="export-options">
          <div class="option-row">
            <label for="export-format">Format:</label>
            <select id="export-format">
              <option value="png">PNG</option>
              <option value="jpeg">JPEG</option>
            </select>
          </div>
          <div class="option-row" id="quality-row">
            <label for="export-quality">Quality:</label>
            <input type="range" id="export-quality" min="1" max="100" value="95" />
            <span id="quality-value">95%</span>
          </div>
        </div>

        <div class="dialog-actions">
          <button id="btn-save-merged" class="btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Save 2x2 Merged
          </button>
        </div>
      </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="dialog hidden">
      <div class="dialog-backdrop"></div>
      <div class="lightbox-content">
        <button class="dialog-close" title="Close (Esc)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <img id="lightbox-img" alt="Preview" />
      </div>
    </div>

    <!-- Drop zone overlay -->
    <div id="drop-zone" class="hidden">
      <div class="drop-zone-content">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <p>Drop panorama image here</p>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
